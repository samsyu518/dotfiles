log_level = "warn"
# outputs = { Targets = ["eDP-1", "HDMI-1"] }
outputs = "All"
position = "Top"
# app_launcher_cmd = "walker"

[modules]
left = [["appLauncher", "Updates", "Workspaces"]]
center = ["WindowTitle"]
right = ["SystemInfo", ["Tray", "Clock", "Privacy", "Settings"]]

[clock]
format = "%D %r"

[system_info]
indicators = [
    "Cpu",
    "Memory",
    "MemorySwap",
    { Disk = "/" },
    "DownloadSpeed",
    "UploadSpeed",
]

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.disk]
warn_threshold = 80
alert_threshold = 90

[system_info.temperature]
warn_threshold = 60
alert_threshold = 80

[updates]
check_cmd = "checkupdates; yay -Qua"
update_cmd = 'ghostty -e bash -c "yay; echo Done - Press enter to exit; read" &'

[workspaces]
visibility_mode = "MonitorSpecific"
enable_workspace_filling = true
max_workspaces = 10

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "rofi -show drun"

[window_title]
truncate_title_after_length = 100

[settings]
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"

[appearance]
style = "Islands"

primary_color = "#7aa2f7"
success_color = "#9ece6a"
text_color = "#a9b1d6"
workspace_colors = ["#7aa2f7", "#9ece6a"]
special_workspace_colors = ["#7aa2f7", "#9ece6a"]

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

[appearance.background_color]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"

[appearance.secondary_color]
base = "#0c0d14"
