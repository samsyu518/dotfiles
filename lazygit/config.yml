git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      # --navigate is dropped: lazygit's docs say it doesn't work inside
      # lazygit's own pager. --dark forces delta's color assumptions instead
      # of letting it guess the terminal background (guessing wrong is a
      # likely cause of the "doesn't look like lazygit" mismatch).
      # side-by-side is controlled solely via ~/.gitconfig [delta] — delta
      # has no CLI way to force a plain gitconfig boolean back to false.
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
os:
  # OSC52 clipboard copy. Detects whether we're inside tmux/screen and wraps
  # the sequence in the tmux passthrough escape when needed; requires
  # `allow-passthrough on` in tmux.conf for the tmux branch to reach the
  # outer terminal.
  copyToClipboardCmd: >
    if [[ "$TERM" =~ ^(screen|tmux) ]]; then

      printf "\033Ptmux;\033\033]52;c;$(printf %s {{text}} | base64 -w 0)\a\033\\" > /dev/tty
    else

      printf "\033]52;c;$(printf %s {{text}} | base64 -w 0)\a" > /dev/tty
    fi

