- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
      force: false
    ~/.config:
      recursive: true

- link:
    ~/.config/dunst: ./dunst/
    ~/.config/ashell: ./ashell/
    ~/.config/ghostty: ./ghostty/
    ~/.config/hypr: ./hypr/
    ~/.config/niri: ./niri/
    ~/.config/sway: ./sway/
    ~/.config/i3: ./i3/
    ~/.config/i3status: ./i3status/
    ~/.config/waybar: ./waybar/
    ~/.config/nvim: ./nvim
    ~/.config/tmux-powerline: ./tmux-powerline
    ~/.config/zellij: ./zellij
    ~/.config/herdr/config.toml: ./herdr/config.toml
    ~/.config/ripgrep/config: ./ripgreprc
    ~/.tmux.conf: ./tmux.conf
    ~/.zshrc: ./zsh/zshrc
    ~/.zshenv: ./zsh/zshenv
    ~/.local/bin/nvim_paste:
      if: 'uname -r | grep -qi microsoft'
      path: ./nvim_paste
- shell:
  - [git submodule update --init --recursive, Installing submodules]
